[project]
name = "family-food-os-backend"
dynamic = ["version"]
description = "Local-first backend API for FamilyFoodOS."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "SQLAlchemy>=2.0.52,<2.1",
  "starlette>=0.40,<0.47",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8,<9",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
