name: PR37 blocker resolution (one shot)

on:
  push:
    branches:
      - 'docs/product-security-integration-final'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/product-security-integration-final
          fetch-depth: 0

      - name: Apply reviewed contract corrections
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          python .github/scripts/pr37_fix_blockers.py

      - name: Commit blocker resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FamilyFoodOS docs automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          echo 'Staged correction scope:'
          git diff --cached --name-only | sed 's/^/  /'
          git commit -m 'docs: resolve PR37 review blockers'
          git push origin HEAD:docs/product-security-integration-final
          echo "Committed correction revision: $(git rev-parse HEAD)"

      - name: Verify final committed PR diff
        shell: bash
        run: |
          set -euo pipefail
          base='origin/main'
          git diff --check "${base}"...HEAD
          tmp_index="$(mktemp)"
          rm -f "${tmp_index}"
          export GIT_INDEX_FILE="${tmp_index}"
          git read-tree "${base}"
          git add -A
          git diff --cached --check "${base}"
          echo 'Full PR staged scope:'
          git diff --cached --name-only "${base}" | sed 's/^/  /'
          rm -f "${tmp_index}"
          unset GIT_INDEX_FILE
          echo 'git diff --check: PASS'
          echo 'git diff --cached --check: PASS'
          echo "tested revision: $(git rev-parse HEAD)"
