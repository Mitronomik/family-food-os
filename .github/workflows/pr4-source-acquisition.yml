name: Temporary PR4 official source acquisition
on:
  push:
    branches:
      - migration/pr4-recipe-catalogue
    paths:
      - .github/workflows/pr4-source-acquisition.yml
permissions:
  contents: read
jobs:
  acquire:
    if: github.ref == 'refs/heads/migration/pr4-recipe-catalogue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Acquire complete official representations
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import concurrent.futures
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.parse import urlparse

          out = Path(os.environ['RUNNER_TEMP']) / 'pr4-source-acquisition'
          out.mkdir()
          evidence = json.loads(Path('docs/family-food/pr4-provenance-refresh-attempt.json').read_text())
          rows = evidence['fresh_attempts']
          assert len(rows) == 22
          assert len({r['accepted_data2_sha256'] for r in rows}) == 22
          fallbacks = {
              'artifact-01': [
                  'https://snaped.fns.usda.gov/sites/default/files/documents/EnglishEaster508_1.pdf',
                  'https://snaped.fns.usda.gov/resources/nutrition-education-materials/recipes/heavenly-deviled-eggs',
                  'https://snaped.fns.usda.gov/resources/recipes-and-menus/healthy-thrifty-holiday-menus/easter',
                  'https://www.myplate.gov/recipes/supplemental-nutrition-assistance-program-snap/heavenly-deviled-eggs',
              ],
              'artifact-02': ['https://wicworks.fns.usda.gov/recipe/beyond-basic-grilled-cheese'],
              'artifact-03': ['https://www.fns.usda.gov/sites/default/files/resource-files/tnc-eggs.pdf'],
              'artifact-04': ['https://www.fns.usda.gov/sites/default/files/resource-files/tnc-applesauce.pdf'],
              'artifact-07': ['https://www.fns.usda.gov/sites/default/files/resource-files/HarvestofRecipes.pdf'],
          }

          def official(url):
              p = urlparse(url)
              return p.scheme == 'https' and (
                  p.hostname == 'usda.gov' or p.hostname.endswith('.usda.gov')
                  or p.hostname in {'fns-prod.azureedge.us', 'fna-bwbufwdzbabpezgc.z01.azurefd.us'}
              )

          def acquire(row):
              record = {
                  'artifact_key': row['artifact_id'],
                  'recipe_source_ids': row['recipe_source_ids'],
                  'accepted_data2_source_url': row['source_url'],
                  'accepted_data2_sha256': row['accepted_data2_sha256'],
                  'retrieval_method': 'GITHUB_ACTIONS_CURL_OFFICIAL_SOURCE',
                  'status': 'FAILED', 'production_source_sha256': None, 'retrieved_at': None,
                  'attempts': [],
              }
              path = out / (row['artifact_id'] + '.download')
              for url in [row['source_url'], *fallbacks.get(row['artifact_id'], [])]:
                  assert official(url), url
                  for http1 in (False, True):
                      cmd = ['curl', '--fail', '--location', '--show-error', '--silent',
                             '--retry', '1', '--retry-delay', '1', '--max-time', '45',
                             '--connect-timeout', '15', '--proto', '=https', '--proto-redir', '=https',
                             '--output', str(path), '--write-out', '%{json}']
                      if http1:
                          cmd.append('--http1.1')
                      result = subprocess.run([*cmd, url], capture_output=True, text=True)
                      completed = datetime.now(timezone.utc).isoformat(timespec='microseconds')
                      try:
                          meta = json.loads(result.stdout)
                      except ValueError:
                          meta = {}
                      attempt = {
                          'requested_url': url, 'effective_url': meta.get('url_effective'),
                          'http_status': meta.get('http_code'), 'content_type': meta.get('content_type'),
                          'curl_exit_code': result.returncode, 'http1_1_requested': http1,
                          'error': result.stderr.strip(),
                      }
                      record['attempts'].append(attempt)
                      data = path.read_bytes() if path.exists() else b''
                      mime = (meta.get('content_type') or '').lower()
                      is_pdf = data.startswith(b'%PDF') and ('pdf' in mime or 'octet-stream' in mime)
                      is_html = ('text/html' in mime or 'application/xhtml+xml' in mime) and bool(
                          re.search(rb'<(?:!doctype\s+html|html)\b', data[:8192], re.I)
                      )
                      denied = bool(re.search(rb'<title[^>]*>\s*(?:access denied|forbidden|error|404|403)|'
                                              rb'<h1[^>]*>\s*(?:access denied|forbidden)|'
                                              rb'you don.t have permission to access', data, re.I))
                      good = (result.returncode == 0 and 200 <= meta.get('http_code', 0) < 300
                              and len(data) > 0 and (is_pdf or is_html) and not denied
                              and official(meta.get('url_effective', '')))
                      if good:
                          name = row['artifact_id'] + ('.pdf' if is_pdf else '.html')
                          path.rename(out / name)
                          digest = hashlib.sha256(data).hexdigest()
                          record.update({k: attempt[k] for k in ('requested_url', 'effective_url', 'http_status', 'content_type')})
                          record.update(status='SUCCESS', byte_size=len(data), file_name=name,
                                        production_source_sha256=digest, retrieved_at=completed,
                                        comparison_result=('BYTE_IDENTICAL_TO_ACCEPTED_DATA2' if digest == row['accepted_data2_sha256'] else 'HASH_CHANGED_REVIEW_REQUIRED'))
                          print(row['artifact_id'], 'SUCCESS', digest, len(data), flush=True)
                          return record
                      if result.returncode == 0:
                          attempt['error'] = 'Rejected: response is not a complete successful official PDF/HTML source representation, or is an error page.'
                      path.unlink(missing_ok=True)
              print(row['artifact_id'], 'FAILED', json.dumps(record['attempts']), flush=True)
              return record

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              records = list(pool.map(acquire, rows))
          manifest = {
              'schema_version': 1, 'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_head_sha': os.environ['GITHUB_SHA'],
              'transport_only': True, 'artifacts': records,
              'successful_count': sum(r['status'] == 'SUCCESS' for r in records),
          }
          (out / 'pr4-source-acquisition-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Successful artifacts:', manifest['successful_count'], '/', len(records), flush=True)
          PYTHON
      - name: Upload temporary acquisition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr4-source-provenance-refresh
          path: ${{ runner.temp }}/pr4-source-acquisition/
          if-no-files-found: error
          retention-days: 7
