name: PR36 final verify and corpus freeze

on:
  push:
    branches:
      - codex/ru-normative-recipe-corpus

permissions:
  contents: write

jobs:
  verify-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ru-normative-recipe-corpus
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend[test]' ruff
      - name: Focused corpus tests
        env:
          PYTHONPATH: backend:.
          AI_ENABLED: "false"
        run: |
          python -m pytest \
            backend/app/tests/test_recipe_source_corpus.py \
            backend/app/tests/persistence/test_recipe_source_corpus_persistence.py
      - name: Corpus lint and diff hygiene
        run: |
          ruff check \
            backend/app/domain/recipe_source_corpus.py \
            backend/app/services/recipe_source_corpus_import.py \
            backend/app/persistence/sqlalchemy_core/recipe_source_corpus_repository.py \
            backend/app/persistence/sqlalchemy_core/recipe_source_corpus_tables.py \
            backend/app/tests/test_recipe_source_corpus.py \
            backend/app/tests/persistence/test_recipe_source_corpus_persistence.py \
            scripts/import_ru_normative_recipe_corpus.py
          ruff format --check \
            backend/app/domain/recipe_source_corpus.py \
            backend/app/services/recipe_source_corpus_import.py \
            backend/app/persistence/sqlalchemy_core/recipe_source_corpus_repository.py \
            backend/app/persistence/sqlalchemy_core/recipe_source_corpus_tables.py \
            backend/app/tests/test_recipe_source_corpus.py \
            backend/app/tests/persistence/test_recipe_source_corpus_persistence.py \
            scripts/import_ru_normative_recipe_corpus.py
          git diff --check origin/main...HEAD
      - name: Full backend and launcher regression
        env:
          PYTHONPATH: backend:.
          AI_ENABLED: "false"
        run: python -m pytest backend/app/tests launcher/tests
      - name: Acquire and import all 214 cards
        env:
          PYTHONPATH: backend:.
          AI_ENABLED: "false"
        run: |
          set -o pipefail
          mkdir -p /tmp/ru-normative-corpus
          python scripts/import_ru_normative_recipe_corpus.py \
            --database /tmp/ru-normative-corpus/corpus.sqlite \
            --sudact-manifest data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19_manifest.json \
            --export-bundle /tmp/ru-normative-corpus/mr_2_4_0162_19.bundle.json \
            | tee /tmp/ru-normative-corpus/import-first.json
      - name: Repeat exact bundle import
        env:
          PYTHONPATH: backend:.
          AI_ENABLED: "false"
        run: |
          set -o pipefail
          python scripts/import_ru_normative_recipe_corpus.py \
            --database /tmp/ru-normative-corpus/corpus.sqlite \
            --bundle /tmp/ru-normative-corpus/mr_2_4_0162_19.bundle.json \
            | tee /tmp/ru-normative-corpus/import-repeat.json
      - name: Assert acquisition and DB invariants
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          root = Path('/tmp/ru-normative-corpus')
          first = json.loads((root / 'import-first.json').read_text())
          repeat = json.loads((root / 'import-repeat.json').read_text())
          bundle = json.loads((root / 'mr_2_4_0162_19.bundle.json').read_text())

          assert first['inserted_cards'] == 214, first
          assert first['card_count'] == 214, first
          assert repeat['inserted_cards'] == 0, repeat
          assert repeat['card_count'] == 214, repeat
          assert len(bundle['cards']) == 214
          keys = {(c['source_section_code'], c['source_card_code']) for c in bundle['cards']}
          assert len(keys) == 214
          for card in bundle['cards']:
              raw = card['raw_card_text']
              assert not any(line.startswith('←') for line in raw.splitlines())
              assert 'Все права защищены' not in raw
              assert 'window.yaContextCb' not in raw

          db = sqlite3.connect(root / 'corpus.sqlite')
          try:
              assert db.execute('SELECT COUNT(*) FROM recipe_source_documents').fetchone()[0] == 1
              assert db.execute('SELECT COUNT(*) FROM recipe_source_cards').fetchone()[0] == 214
              assert db.execute("SELECT COUNT(*) FROM schema_migrations WHERE migration_id='0030_recipe_source_corpus'").fetchone()[0] == 1
              assert db.execute('SELECT COUNT(*) FROM food_recipe_versions').fetchone()[0] == 0
              assert db.execute('PRAGMA foreign_key_check').fetchall() == []
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          finally:
              db.close()

          summary = {
              'cards': 214,
              'unique_section_card_keys': 214,
              'first_inserted_cards': 214,
              'repeat_inserted_cards': 0,
              'page_chrome_rows': 0,
              'production_recipe_versions_fresh_db': 0,
          }
          (root / 'verification-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(summary, ensure_ascii=False))
          PY
      - name: Freeze verified corpus and canonical state
        env:
          ACCEPTED_MAIN: 7388d19677cffbf5cd6cb192eabc0b93cad870f7
        run: |
          set -euo pipefail
          TESTED_HEAD="$(git rev-parse HEAD)"
          export TESTED_HEAD
          branch='codex/ru-normative-recipe-corpus'
          snapshot='data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19.bundle.json'

          git fetch origin "$branch"
          if [ "$(git rev-parse "origin/$branch")" != "$TESTED_HEAD" ]; then
            echo 'Branch advanced during verification; refusing stale finalization.' >&2
            exit 1
          fi

          cp /tmp/ru-normative-corpus/mr_2_4_0162_19.bundle.json "$snapshot"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          snapshot = Path('data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19.bundle.json')
          bundle = json.loads(snapshot.read_text())
          assert len(bundle['cards']) == 214
          assert len({(c['source_section_code'], c['source_card_code']) for c in bundle['cards']}) == 214
          assert not any(
              any(line.startswith('←') for line in c['raw_card_text'].splitlines())
              or 'Все права защищены' in c['raw_card_text']
              or 'window.yaContextCb' in c['raw_card_text']
              for c in bundle['cards']
          )
          snapshot_sha = hashlib.sha256(snapshot.read_bytes()).hexdigest()

          roadmap_path = Path('docs/family-food/master-roadmap.md')
          roadmap = roadmap_path.read_text()
          roadmap = roadmap.replace('0030_recipe_template_catalogue', '0031_recipe_template_catalogue')
          roadmap = roadmap.replace(
              'migration 0030 or seed publication.',
              'RecipeTemplate migration or seed publication. The supporting source-corpus operation occupies `0030_recipe_source_corpus`; future RecipeTemplate schema is therefore `0031_recipe_template_catalogue`.',
          )
          roadmap = roadmap.replace('or 0030 implementation.', 'or RecipeTemplate implementation.')
          anchor = 'See the [retained evidence](../../data/curation/recipe-assembly-a/README.md).\n'
          note = ('\n`0030_recipe_source_corpus` is a bounded pre-publication source-corpus supporting operation introduced by PR #36. It preserves normative source cards for later deterministic resolution/review and does not complete Assembly A, publish RecipeTemplate/RecipeVersion, or start the later full Data Program.\n')
          if note.strip() not in roadmap:
              if anchor not in roadmap:
                  raise SystemExit('Roadmap Assembly-A anchor not found')
              roadmap = roadmap.replace(anchor, anchor + note, 1)
          if '0030_recipe_template_catalogue' in roadmap:
              raise SystemExit('Stale 0030 RecipeTemplate migration remains')
          roadmap_path.write_text(roadmap)

          corpus_path = Path('docs/family-food/ru-normative-recipe-corpus.md')
          corpus = corpus_path.read_text()
          marker = '\n## Bootstrap\n'
          section = '''\n## Зафиксированный полный snapshot\n\nПосле live acquisition полный очищенный source bundle сохраняется в репозитории:\n\n`data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19.bundle.json`\n\nОн содержит ровно 214 section-scoped карт и позволяет восстановить source-corpus БД офлайн через `--bundle`, без повторного обращения к HTML-зеркалу. Для Sudact `raw_card_text` обрезается строго до первой навигационной границы `←`; navigation, footer, scripts и copyright chrome зеркала не являются нормативной source truth. Если ожидаемая граница страницы отсутствует, acquisition завершается fail-closed.\n\n'''
          if section.strip() not in corpus:
              if marker not in corpus:
                  raise SystemExit('Corpus Bootstrap marker not found')
              corpus = corpus.replace(marker, section + marker, 1)
          corpus_path.write_text(corpus)

          verification = {
              'operation': 'RU_NORMATIVE_RECIPE_SOURCE_CORPUS',
              'accepted_main': os.environ['ACCEPTED_MAIN'],
              'tested_head': os.environ['TESTED_HEAD'],
              'github_actions_run_id': os.environ['GITHUB_RUN_ID'],
              'focused_tests': 'PASS',
              'ruff': 'PASS',
              'full_backend_launcher_regression': 'PASS',
              'live_acquisition': 'PASS',
              'cards': 214,
              'unique_section_card_keys': 214,
              'repeat_inserted_cards': 0,
              'page_chrome_rows': 0,
              'migration': '0030_recipe_source_corpus',
              'future_recipe_template_migration': '0031_recipe_template_catalogue',
              'snapshot_path': str(snapshot),
              'snapshot_sha256': snapshot_sha,
              'production_recipe_versions_mutated': False,
              'assembly_a': 'BLOCKED',
              'assembly_b': 'NOT STARTED',
              'pr7_plus': 'NOT STARTED',
          }
          vp = Path('data/curation/ru-normative-recipe-corpus/verification.json')
          vp.parent.mkdir(parents=True, exist_ok=True)
          vp.write_text(json.dumps(verification, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > state/current-focus.md <<EOF
          # Current focus

          Updated: \`2026-09-13\`.

          - PR6 / PR6-CLOSE = COMPLETE.
          - [PR #34](https://github.com/Mitronomik/family-food-os/pull/34) = MERGED.
          - [PR #35](https://github.com/Mitronomik/family-food-os/pull/35) = MERGED.
          - Exact accepted main after PR #35: \`$ACCEPTED_MAIN\`.
          - R1 / R2 / R3 / R4 = COMPLETE AS BLOCKED RESEARCH; R1/R2/R3 evidence packages remain frozen.
          - R1-21 and R1-23 = INDIVIDUALLY_READY, unchanged exact published 100-portion scopes.
          - ready = 2/3; third_candidate = none.
          - OPEN Assembly-A evidence gates: family_count, optional_role, verified_substitution.
          - R4-N50200 = COMPLETE AS BLOCKED RESEARCH; no executable production-data enablement plan was issued.
          - Current authorized operation: [PR #36](https://github.com/Mitronomik/family-food-os/pull/36), Russian normative recipe source corpus and bulk importer; OPEN / REVIEW-READY, not merged.
          - PR #36 is synchronized on accepted main. Runtime/acquisition verification head: \`$TESTED_HEAD\`.
          - Live acquisition = PASS: exactly 214/214 section-scoped cards; exact repeat import inserted 0; page-chrome rows 0.
          - Focused tests, Ruff, full \`backend/app/tests + launcher/tests\` regression, migration/import invariants and artifact capture = PASS on the verified head.
          - Durable cleaned source snapshot: \`data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19.bundle.json\`.
          - Current accepted main migration remains \`0029_food_composition_core\` until PR #36 is merged.
          - PR #36 introduces \`0030_recipe_source_corpus\`; future RecipeTemplate schema is \`0031_recipe_template_catalogue\`.
          - Source-corpus ingestion does not publish RecipeVersion/RecipeTemplate and does not replace FoodIngredient/Nutrition/Composition deterministic truth.
          - Assembly A = BLOCKED; Assembly B and PR7+ = NOT STARTED.

          Next authorized action: final human review / merge decision for PR #36, then stop.
          No automatic merge, Assembly B, PR7, RecipeTemplate publication, production recipe publication or new donor/data-repair operation is authorized.
          EOF
          sed -i 's/^          //' state/current-focus.md

          cat > state/handoff.md <<EOF
          # Handoff

          Updated: \`2026-09-13\`.

          PR #35 is MERGED; accepted main is \`$ACCEPTED_MAIN\`.
          R1/R2/R3/R4 are COMPLETE AS BLOCKED RESEARCH. Assembly A remains BLOCKED at 2/3 individually ready families (R1-21, R1-23); family_count, optional_role and verified_substitution remain open. Assembly B and PR7+ are NOT STARTED.

          Current bounded operation is [PR #36](https://github.com/Mitronomik/family-food-os/pull/36) on \`codex/ru-normative-recipe-corpus\`.
          Verified runtime/acquisition head: \`$TESTED_HEAD\`.
          It adds the pre-publication Russian normative recipe source corpus and migration \`0030_recipe_source_corpus\`; future RecipeTemplate migration is \`0031_recipe_template_catalogue\`.

          Final verification on the synchronized head: focused tests PASS; Ruff PASS; full backend + launcher regression PASS; live acquisition PASS at exactly 214/214 section-scoped cards; exact repeat import inserted 0; DB invariants PASS; mirror navigation/footer/scripts are excluded from all 214 raw card bodies. The cleaned durable bundle is \`data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19.bundle.json\` with SHA-256 recorded in \`data/curation/ru-normative-recipe-corpus/verification.json\`.

          PR #36 remains pre-publication only: no FoodIngredient/Nutrition/Composition authority changes, no RecipeVersion/RecipeTemplate publication, no Planner/MealPlan/Shopping/Prep/API/UI, no Assembly B or PR7 start.

          Next: final review / merge decision for PR #36. Do not self-merge and do not start the next milestone automatically.
          EOF
          sed -i 's/^          //' state/handoff.md

          git rm .github/workflows/pr36-final-verify.yml
          git diff --check
          git add \
            data/seed/ru_normative_recipe_corpus/mr_2_4_0162_19.bundle.json \
            data/curation/ru-normative-recipe-corpus/verification.json \
            docs/family-food/master-roadmap.md \
            docs/family-food/ru-normative-recipe-corpus.md \
            state/current-focus.md \
            state/handoff.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: freeze verified 214-card normative recipe corpus'
          git push origin HEAD:codex/ru-normative-recipe-corpus
      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr36-final-verification
          path: /tmp/ru-normative-corpus/
          if-no-files-found: warn
          retention-days: 7
