name: Real-catalogue composed lunch diagnostic week

on:
  pull_request:
    paths:
      - 'scripts/real_catalogue_composed_lunch.py'
      - 'backend/app/tests/test_real_catalogue_composed_lunch.py'
      - '.github/workflows/real-catalogue-composed-lunch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-backed-week:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_ENABLED: 'false'
      PYTHONPATH: 'backend:.'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]' 'ruff==0.16.8'
      - name: Real source week, composed MealPlan and V2 Shopping assertions
        run: python -m pytest -q --tb=short --maxfail=2 backend/app/tests/test_real_catalogue_composed_lunch.py
      - name: Build actual disposable real-source multi-course week receipt
        run: |
          python -m scripts.real_catalogue_composed_lunch > /tmp/real-source-composed-week.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/real-source-composed-week.json').read_text(encoding='utf-8'))
          assert obj['decision']=='NO_GO_FOR_CONSUMER_OR_PHYSICAL_SERVING'
          assert obj['evidence']['event_count']==7
          assert obj['evidence']['composed_event_count']==1
          assert obj['evidence']['individual_component_servings']==2
          assert obj['evidence']['shopping_status']=='COMPLETE'
          assert obj['evidence']['price_status']=='UNKNOWN'
          assert len(obj['evidence']['shopping'])>=1
          assert obj['limitations']['customer_activation'] is False
          PY
      - name: Ruff and source whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m ruff check scripts/real_catalogue_composed_lunch.py backend/app/tests/test_real_catalogue_composed_lunch.py
          python -m ruff format --check scripts/real_catalogue_composed_lunch.py backend/app/tests/test_real_catalogue_composed_lunch.py
          git diff --check "$BASE_SHA"...HEAD
          test "$AI_ENABLED" = false
      - uses: actions/upload-artifact@v4
        with:
          name: real-catalogue-composed-lunch-diagnostic-no-go
          path: /tmp/real-source-composed-week.json
          if-no-files-found: error
          retention-days: 30
