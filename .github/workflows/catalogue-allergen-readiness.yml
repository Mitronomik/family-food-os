name: Whole-catalogue allergen readiness inventory

on:
  pull_request:
    paths:
      - 'scripts/audit_food_allergen_readiness.py'
      - 'backend/app/tests/test_allergen_catalogue_readiness.py'
      - 'backend/app/seed/**'
      - 'data/curation/**'
      - 'backend/app/services/food_ingredients.py'
      - 'backend/app/services/food_recipes.py'
      - 'backend/app/persistence/sqlalchemy_core/food_ingredient_*.py'
      - 'backend/app/persistence/sqlalchemy_core/food_recipe_*.py'
      - 'backend/app/domain/food_recipes.py'
      - 'backend/app/domain/food_ingredients.py'
      - 'backend/app/db/migrations/**'
      - '.github/workflows/catalogue-allergen-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-allergens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AI_ENABLED: 'false'
      PYTHONPATH: 'backend:.'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test tools
        run: python -m pip install -e './backend[test]' 'ruff==0.16.8'
      - name: Catalogue-wide and adversarial review-proposal tests
        run: python -m pytest -q --tb=short --maxfail=3 backend/app/tests/test_allergen_catalogue_readiness.py
      - name: Produce full current catalog and every dependency receipt
        run: |
          python -m scripts.audit_food_allergen_readiness > /tmp/catalogue-allergens.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('/tmp/catalogue-allergens.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          summary = data['summary']
          assert data['schema'] == 'FOOD_ALLERGEN_CATALOGUE_READINESS_V1'
          assert summary['food_ingredients_total'] == len(data['foods'])
          assert summary['food_ingredients_unknown'] == len(data['unresolved_queue'])
          assert summary['active_food_ingredients_unknown'] == len(data['active_unresolved_queue'])
          assert summary['recipes_active_total'] == len(data['active_recipes'])
          assert data['limitations']['ready_for_bulk_publication'] is False
          assert data['limitations']['family_admission_granted'] is False
          print('FULL_CATALOGUE_ALLERGEN_READINESS_SUMMARY:', json.dumps(summary, sort_keys=True))
          print('REPORT_BYTES:', path.stat().st_size)
          print('REPORT_SHA256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Ruff and source whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m ruff check scripts/audit_food_allergen_readiness.py backend/app/tests/test_allergen_catalogue_readiness.py
          python -m ruff format --check scripts/audit_food_allergen_readiness.py backend/app/tests/test_allergen_catalogue_readiness.py
          git diff --check "$BASE_SHA"...HEAD
          test "$AI_ENABLED" = false
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-allergen-catalogue-readiness-and-recipe-dependencies
          path: /tmp/catalogue-allergens.json
          if-no-files-found: error
          retention-days: 30
