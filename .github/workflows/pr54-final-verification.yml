name: PR54 final clean-head verification

on:
  push:
    branches:
      - ci/pr54-final-verification-808356d1

permissions:
  contents: read

jobs:
  focused-pr7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR54 clean head
        uses: actions/checkout@v4
        with:
          ref: 808356d15d0712c86b99c7ff0c11946a9059f213
          fetch-depth: 0
      - name: Assert exact clean head
        run: test "$(git rev-parse HEAD)" = "808356d15d0712c86b99c7ff0c11946a9059f213"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Focused PR7 verification
        run: >-
          python -m pytest
          backend/app/tests/test_meal_plans.py
          backend/app/tests/test_meal_plan_application.py
          backend/app/tests/test_meal_plan_migration.py
          backend/app/tests/persistence/test_meal_plan_repository.py
          backend/app/tests/test_migration_lineage.py
          --junitxml=pr54-focused.xml
      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr54-focused-junit
          path: pr54-focused.xml
          if-no-files-found: error

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR54 clean head
        uses: actions/checkout@v4
        with:
          ref: 808356d15d0712c86b99c7ff0c11946a9059f213
          fetch-depth: 0
      - name: Assert exact clean head
        run: test "$(git rev-parse HEAD)" = "808356d15d0712c86b99c7ff0c11946a9059f213"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Full backend regression
        run: python -m pytest backend/app/tests --junitxml=pr54-backend.xml
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr54-backend-junit
          path: pr54-backend.xml
          if-no-files-found: error

  launcher-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR54 clean head
        uses: actions/checkout@v4
        with:
          ref: 808356d15d0712c86b99c7ff0c11946a9059f213
          fetch-depth: 0
      - name: Assert exact clean head
        run: test "$(git rev-parse HEAD)" = "808356d15d0712c86b99c7ff0c11946a9059f213"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Full launcher regression
        run: python -m pytest launcher/tests --junitxml=pr54-launcher.xml
      - name: Upload launcher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr54-launcher-junit
          path: pr54-launcher.xml
          if-no-files-found: error
