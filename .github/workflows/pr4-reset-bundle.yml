name: PR4 final scope reset verification

on:
  push:
    branches:
      - migration/pr4-recipe-catalogue

permissions:
  contents: write

jobs:
  reset-verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Apply approved PR4 scope reset
        run: |
          set -euo pipefail
          python scripts/pr4_reset_payload_a.py
          python scripts/pr4_reset_payload_b.py
          python scripts/pr4_reset_payload_c.py
          python scripts/pr4_reset_payload_d.py
          python scripts/pr4_reset_payload_e.py
          python scripts/pr4_reset_payload_f.py

          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/tests/persistence/test_food_recipe_repository.py')
          text = path.read_text(encoding='utf-8')
          old = '''    with SqlAlchemyRecipeCatalogueUnitOfWork(engine) as scope:\n        with pytest.raises(RecipeCataloguePersistenceConflictError):\n            scope.versions.add_detail(detail)\n'''
          new = '''    with (\n        SqlAlchemyRecipeCatalogueUnitOfWork(engine) as scope,\n        pytest.raises(RecipeCataloguePersistenceConflictError),\n    ):\n        scope.versions.add_detail(detail)\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected one repository nested conflict context.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm -f \
            docs/family-food/pr4-github-actions-acquisition.json \
            docs/family-food/pr4-provenance-refresh-attempt.json \
            docs/family-food/pr4-retrieval-provenance-review.json \
            docs/family-food/pr4-retrieval-provenance-review.md \
            docs/family-food/pr4-rights-review.md

          python scripts/build_pr4_recipe_seed.py
          cp data/seed/recipes/recipes.json /tmp/recipes.first.json
          cp data/seed/recipes/source-manifest.json /tmp/manifest.first.json
          python scripts/build_pr4_recipe_seed.py
          cmp /tmp/recipes.first.json data/seed/recipes/recipes.json
          cmp /tmp/manifest.first.json data/seed/recipes/source-manifest.json

      - name: Install backend and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[test]' ruff

      - name: Format and lint final reset Python
        run: |
          set -euo pipefail
          FILES=(
            backend/app/domain/food_recipes.py
            backend/app/services/food_recipes.py
            backend/app/seed/food_recipes.py
            backend/app/persistence/sqlalchemy_core/food_recipe_tables.py
            backend/app/tests/test_food_recipe_domain.py
            backend/app/tests/test_food_recipe_application.py
            backend/app/tests/test_food_recipe_migration.py
            backend/app/tests/test_food_recipe_seed.py
            backend/app/tests/persistence/test_food_recipe_repository.py
            scripts/build_pr4_recipe_seed.py
          )
          ruff format "${FILES[@]}"
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff format --check "${FILES[@]}"
          ruff check "${FILES[@]}"

      - name: Verify DATA2 handoff
        run: |
          set -euo pipefail
          python scripts/validate_pr4_data2.py
          python -m pytest -q backend/app/tests/test_pr4_data2_research.py

      - name: Verify PR4 focused suite
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/app/tests/test_food_recipe_domain.py \
            backend/app/tests/test_food_recipe_application.py \
            backend/app/tests/test_food_recipe_architecture.py \
            backend/app/tests/test_food_recipe_migration.py \
            backend/app/tests/test_food_recipe_seed.py \
            backend/app/tests/persistence/test_food_recipe_repository.py

      - name: Verify fresh and idempotent Recipe seed
        run: |
          python - <<'PY'
          from dataclasses import asdict
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from app.db.config import DatabaseConfig
          from app.seed.food_recipes import seed_food_recipes

          with TemporaryDirectory() as tmp:
              config = DatabaseConfig(path=Path(tmp) / 'fresh.sqlite')
              first = seed_food_recipes(config)
              second = seed_food_recipes(config)
              print('FIRST_SEED', asdict(first))
              print('SECOND_SEED', asdict(second))
              assert first.recipes_inserted == 30
              assert first.versions_inserted == 30
              assert first.ingredients_inserted == 189
              assert first.steps_inserted == 169
              assert first.equipment_inserted == 86
              assert first.conflicts == 0
              assert second.recipes_inserted == 0
              assert second.versions_inserted == 0
              assert second.ingredients_inserted == 0
              assert second.steps_inserted == 0
              assert second.equipment_inserted == 0
              assert second.recipes_existing == 30
              assert second.versions_existing == 30
              assert second.ingredients_existing == 189
              assert second.steps_existing == 169
              assert second.equipment_existing == 86
              assert second.conflicts == 0
          PY

      - name: Verify full backend and launcher regression
        run: python -m pytest -q backend/app/tests launcher/tests

      - name: Static and scope checks
        run: |
          set -euo pipefail
          git diff --check
          test "$(python -c "import json; r=json.load(open('data/seed/recipes/recipes.json'))['recipes']; print(len(r),sum(len(x['version']['ingredients']) for x in r),sum(len(x['version']['steps']) for x in r),sum(len(x['version']['equipment_codes']) for x in r),len({i['food_ingredient_code'] for x in r for i in x['version']['ingredients']}))")" = "30 189 169 86 81"
          ! grep -R "EXPECTED_MANIFEST_CODE_COUNT = 119\|365 RecipeIngredient\|315 RecipeStep" backend/app/seed scripts/build_pr4_recipe_seed.py data/seed/recipes
          python - <<'PY'
          import json
          recipes = json.load(open('data/seed/recipes/recipes.json', encoding='utf-8'))['recipes']
          assert all(r['version']['source_retrieved_at'] is None or isinstance(r['version']['source_retrieved_at'], str) for r in recipes)
          assert {r['version']['source_recipe_id'] for r in recipes} == {
              r['recipe_source_id'] for r in json.load(open('data/curation/pr4-data2/recipe-corpus.json', encoding='utf-8'))['recipes']
          }
          PY

      - name: Commit verified scope reset and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f \
            scripts/pr4_scope_reset_apply.py \
            scripts/pr4_reset_payload_a.py \
            scripts/pr4_reset_payload_b.py \
            scripts/pr4_reset_payload_c.py \
            scripts/pr4_reset_payload_d.py \
            scripts/pr4_reset_payload_e.py \
            scripts/pr4_reset_payload_f.py \
            .github/workflows/pr4-reset-bundle.yml
          rm -rf .tmp/pr4-scope-reset
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached origin/main -- .github/workflows)"
          git config user.name 'FamilyFoodOS Orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'PR4: reset recipe catalogue to accepted DATA2'
          git push origin HEAD:migration/pr4-recipe-catalogue
