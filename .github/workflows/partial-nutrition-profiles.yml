name: Partial nutrition profiles

on:
  pull_request:
    paths:
      - 'backend/app/domain/food_ingredients.py'
      - 'backend/app/db/migrations.py'
      - 'backend/app/db/migration_lineage.py'
      - 'backend/app/migrations/versions/0034_partial_nutrition_profiles.py'
      - 'backend/app/persistence/sqlalchemy_core/food_ingredient_tables.py'
      - 'backend/app/persistence/sqlalchemy_core/food_ingredient_repositories.py'
      - 'backend/app/tests/test_food_ingredient_domain.py'
      - 'backend/app/tests/persistence/test_food_ingredient_repository.py'
      - 'backend/app/tests/test_partial_nutrition_profile_migration.py'
      - 'backend/app/tests/test_migration_lineage.py'
      - 'backend/app/tests/test_migration_runner_rebuild.py'
      - 'backend/app/tests/test_nutrient_vector.py'
      - 'backend/app/seed/ru_nut_db_step8_butter.py'
      - 'backend/app/tests/test_ru_nut_db_step8_butter_publication.py'
      - 'data/curation/ru-nut-db-step8-butter-runtime/**'
      - 'backend/app/services/food_recipes.py'
      - 'backend/app/seed/ru_school2022_step9_recipe.py'
      - 'backend/app/tests/test_ru_school2022_step9_recipe_publication.py'
      - 'data/curation/ru-school2022-step9-recipe-runtime/**'
      - 'backend/app/domain/recipe_nutrition_v2.py'
      - 'backend/app/migrations/versions/0039_recipe_ingredient_composition_binding.py'
      - 'backend/app/persistence/sqlalchemy_core/recipe_nutrition_v2.py'
      - 'backend/app/persistence/sqlalchemy_core/recipe_nutrition_v2_tables.py'
      - 'backend/app/services/recipe_nutrition_v2.py'
      - 'backend/app/services/recipe_nutrition_v2_contracts.py'
      - 'backend/app/seed/ru_school2022_step10a_binding.py'
      - 'backend/app/tests/test_recipe_nutrition_v2.py'
      - 'backend/app/tests/test_recipe_nutrition_v2_migration.py'
      - 'backend/app/tests/test_ru_school2022_step10a_binding.py'
      - 'backend/app/tests/table_guards.py'
      - 'docs/family-food/**'
      - 'state/**'
      - '.github/workflows/partial-nutrition-profiles.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Focused partial-profile and migration verification
        run: >-
          python -m pytest -q
          backend/app/tests/test_food_ingredient_domain.py
          backend/app/tests/test_food_ingredient_application.py
          backend/app/tests/persistence/test_food_ingredient_repository.py
          backend/app/tests/test_food_ingredient_migration.py
          backend/app/tests/test_partial_nutrition_profile_migration.py
          backend/app/tests/test_nutrient_vector.py
          backend/app/tests/test_ru_nut_db_step4_publication.py
          backend/app/tests/test_ru_nut_db_step8_butter_publication.py
          backend/app/tests/test_ru_school2022_step9_recipe_publication.py
          backend/app/tests/test_recipe_nutrition_v2.py
          backend/app/tests/test_recipe_nutrition_v2_migration.py
          backend/app/tests/test_ru_school2022_step10a_binding.py
          backend/app/tests/test_food_composition.py
          backend/app/tests/test_migration_lineage.py
          backend/app/tests/test_migration_runner_rebuild.py
          backend/app/tests/persistence/test_migration_coexistence.py

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      AI_ENABLED: 'false'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Full backend regression shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find backend/app/tests -type f -name 'test_*.py' | sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 4 == SHARD )); then
              selected+=("${files[$index]}")
            fi
          done
          printf 'backend shard %s: %s files\n' "$SHARD" "${#selected[@]}"
          test "${#selected[@]}" -gt 0
          python -m pytest -q "${selected[@]}"

  launcher-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Full launcher regression
        run: python -m pytest -q launcher/tests
