name: Shopping v1b diagnostic composition acceptance

on:
  pull_request:
    paths:
      - 'backend/app/domain/shopping_composition_calculation.py'
      - 'backend/app/services/shopping_diagnostic.py'
      - 'backend/app/services/shopping.py'
      - 'backend/app/api/shopping.py'
      - 'backend/app/tests/persistence/test_shopping_composition_v1b.py'
      - 'backend/app/tests/test_composed_week_preview.py'
      - 'scripts/composed_week_preview.py'
      - 'scripts/composed_week_evidence.py'
      - 'backend/app/tests/test_composed_week_evidence.py'
      - '.github/workflows/shopping-composition-v1b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_ENABLED: 'false'
      PYTHONPATH: 'backend:.'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]' 'ruff==0.16.8'
      - name: V1b exact source, isolation, rollback and V1 regression
        run: |
          python -m pytest -q --tb=short --maxfail=3 \
            backend/app/tests/persistence/test_shopping_composition_v1b.py \
            backend/app/tests/test_composed_week_preview.py \
            backend/app/tests/test_composed_week_evidence.py \
            backend/app/tests/persistence/test_meal_plan_full_week_composition.py \
            backend/app/tests/persistence/test_shopping_persistence.py \
            backend/app/tests/test_shopping_api.py \
            backend/app/tests/test_shopping_calculation.py
      - name: Ruff and format all changed runtime files
        run: |
          python -m ruff check \
            backend/app/domain/shopping_composition_calculation.py \
            backend/app/services/shopping_diagnostic.py \
            backend/app/services/shopping.py \
            backend/app/api/shopping.py \
            backend/app/tests/persistence/test_shopping_composition_v1b.py \
            backend/app/tests/test_composed_week_preview.py \
            backend/app/tests/test_composed_week_evidence.py \
            scripts/composed_week_preview.py \
            scripts/composed_week_evidence.py
          python -m ruff format --check \
            backend/app/domain/shopping_composition_calculation.py \
            backend/app/services/shopping_diagnostic.py \
            backend/app/services/shopping.py \
            backend/app/api/shopping.py \
            backend/app/tests/persistence/test_shopping_composition_v1b.py \
            backend/app/tests/test_composed_week_preview.py \
            backend/app/tests/test_composed_week_evidence.py \
            scripts/composed_week_preview.py \
            scripts/composed_week_evidence.py
      - name: Source whitespace and AI gate
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          test "$AI_ENABLED" = false

  broad:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AI_ENABLED: 'false'
      PYTHONPATH: 'backend:.'
    steps:
      # Some full-regression tests verify immutable source commits via git show.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Full backend and launcher
        run: python -m pytest -q backend/app/tests launcher/tests --tb=short --maxfail=3
