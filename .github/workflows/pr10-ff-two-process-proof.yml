name: PR10-FF two-process real Planner proof

on:
  pull_request:
    paths:
      - 'scripts/pr10_ff_two_process_proof.py'
      - 'backend/app/tests/test_pr10_ff_two_process_proof.py'
      - '.github/workflows/pr10-ff-two-process-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[test]' ruff
      - name: Focused unit tests
        env:
          PYTHONPATH: backend:.
        run: python -m pytest -q backend/app/tests/test_pr10_ff_two_process_proof.py
      - name: Ruff format diagnostic diff
        run: ruff format --diff scripts/pr10_ff_two_process_proof.py backend/app/tests/test_pr10_ff_two_process_proof.py
      - name: Ruff lint and format
        run: |
          ruff check scripts/pr10_ff_two_process_proof.py backend/app/tests/test_pr10_ff_two_process_proof.py
          ruff format --check scripts/pr10_ff_two_process_proof.py backend/app/tests/test_pr10_ff_two_process_proof.py
      - name: One-shot independent processes (no reroll)
        env:
          PYTHONPATH: backend:.
          AI_ENABLED: 'false'
        run: python scripts/pr10_ff_two_process_proof.py --output-dir "$RUNNER_TEMP/pr10-ff-proof"
      - name: Upload raw evidence even on NO_GO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr10-ff-issue268-raw-process-receipts
          path: ${{ runner.temp }}/pr10-ff-proof/*.json
          if-no-files-found: warn
          retention-days: 30
