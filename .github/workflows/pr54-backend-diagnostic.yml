name: PR54 backend diagnostic

on:
  push:
    branches:
      - ci/pr54-backend-diagnostic-eea7c7bf

permissions:
  contents: read

jobs:
  backend-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR54 head
        uses: actions/checkout@v4
        with:
          ref: eea7c7bf61d1e20c5cfbce7a59a6e78e8dbcae70
          fetch-depth: 0
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "eea7c7bf61d1e20c5cfbce7a59a6e78e8dbcae70"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"
      - name: Full backend diagnostic regression
        shell: bash
        run: |
          set -o pipefail
          PYTHONUNBUFFERED=1 python -m pytest backend/app/tests -vv -ra --tb=short --durations=50 --junitxml=pr54-backend.xml 2>&1 | tee pr54-backend.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr54-backend-diagnostic
          path: |
            pr54-backend.xml
            pr54-backend.log
          if-no-files-found: warn
