name: R1-E corpus blockers

on:
  pull_request:
    paths:
      - 'data/curation/r1d-planner-admission/source-inventory.jsonl'
      - 'data/curation/data-corpus-v1-dc1/candidate-recipes.csv'
      - 'data/curation/r1a-planner-capacity-dependencies/dependency-manifest.json'
      - 'data/curation/r1b-reviewed-recipes/publication.json'
      - 'docs/family-food/r1-cross-corpus-consumed-nutrition-review.md'
      - 'docs/family-food/r1-cross-corpus-candidate-universe-decision.md'
      - 'data/curation/r1e-corpus-blockers/**'
      - 'scripts/build_r1e_corpus_blockers.py'
      - 'scripts/validate_r1e_corpus_blockers.py'
      - '.github/workflows/r1e-corpus-blockers.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or exact commit SHA to verify'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blocker-map-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.16.8'

      - name: Compile and lint classifier
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_r1e_corpus_blockers.py \
            scripts/validate_r1e_corpus_blockers.py
          ruff check \
            scripts/build_r1e_corpus_blockers.py \
            scripts/validate_r1e_corpus_blockers.py
          ruff format --check \
            scripts/build_r1e_corpus_blockers.py \
            scripts/validate_r1e_corpus_blockers.py

      - name: Validate committed blocker package
        run: python scripts/validate_r1e_corpus_blockers.py

      - name: Diff whitespace gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-origin/main}"
          git fetch origin main --no-tags
          git diff --check "$base"...HEAD

      - name: Verification summary
        run: |
          echo "tested revision: $(git rev-parse HEAD)"
          echo '547 retained recipe identities: PASS'
          echo 'deterministic next blocker for every row: PASS'
          echo 'selected breakfast capacity batch: PASS'
          echo 'generated == committed blocker package: PASS'
