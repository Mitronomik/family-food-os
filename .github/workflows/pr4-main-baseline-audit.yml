name: PR4 main baseline audit

on:
  push:
    branches:
      - migration/pr4-recipe-catalogue

permissions:
  contents: read

jobs:
  main-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify exact main baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2f5fba991f1f612ce7b4b8dfda8ebd41ad6333e7"
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[test]'
          python -m pytest -q backend/app/tests launcher/tests
