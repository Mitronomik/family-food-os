name: PR47 runtime verification

on:
  push:
    branches:
      - feature/pr7-support-meal-pattern-catalogue

permissions:
  contents: read

jobs:
  runtime-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"

      - name: Focused Meal Pattern verification
        run: >-
          python -m pytest
          backend/app/tests/test_meal_pattern_domain.py
          backend/app/tests/test_meal_pattern_application.py
          backend/app/tests/test_meal_pattern_migration.py
          backend/app/tests/test_meal_pattern_seed.py
          backend/app/tests/test_meal_pattern_architecture.py
          backend/app/tests/test_migration_lineage.py

      - name: Full backend and launcher regression
        run: make test-backend
