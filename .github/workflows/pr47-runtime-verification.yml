name: PR51 runtime verification

on:
  push:
    branches:
      - feature/pr7-support-meal-pattern-catalogue

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload migration regression sources
        uses: actions/upload-artifact@v4
        with:
          name: pr51-migration-regression-sources
          path: |
            backend/app/tests/persistence/test_recipe_source_corpus_persistence.py
            backend/app/tests/test_artifact_audit_operations_migration.py
            backend/app/tests/test_database_foundation.py
            backend/app/tests/test_family_food_identity_migration.py
            backend/app/tests/test_food_composition_migration.py
            backend/app/tests/test_household_migration.py
            backend/app/tests/test_migration_runner_rebuild.py
            backend/app/tests/test_nutrient_vector.py
          if-no-files-found: error

  focused-meal-pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"

      - name: Focused Meal Pattern verification
        run: >-
          python -m pytest
          backend/app/tests/test_meal_pattern_domain.py
          backend/app/tests/test_meal_pattern_application.py
          backend/app/tests/test_meal_pattern_migration.py
          backend/app/tests/test_meal_pattern_seed.py
          backend/app/tests/test_meal_pattern_architecture.py
          backend/app/tests/test_migration_lineage.py

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"

      - name: Full backend regression
        run: python -m pytest backend/app/tests --junitxml=backend-regression.xml

      - name: Upload backend regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-junit
          path: backend-regression.xml
          if-no-files-found: error

  launcher-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e "backend[test]"

      - name: Full launcher regression
        run: python -m pytest launcher/tests --junitxml=launcher-regression.xml

      - name: Upload launcher regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-regression-junit
          path: launcher-regression.xml
          if-no-files-found: error
