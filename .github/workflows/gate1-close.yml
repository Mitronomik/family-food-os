name: Gate1 closure

on:
  pull_request:
    paths:
      - 'scripts/validate_gate1_close.py'
      - 'data/curation/gate1-close/**'
      - 'docs/family-food/gate1-closure.md'
      - 'state/**'
      - '.github/workflows/gate1-close.yml'
      - '.github/workflows/dc4-corpus-readiness-rerun.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or exact commit SHA to verify'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_ENABLED: 'false'
      ACCEPTED_BASE: '73cb7ee6b20d1af958639f75f6fa5db286381cb3'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend and Ruff
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e './backend[test]'
          python -m pip install --disable-pip-version-check 'ruff==0.16.8'

      - name: Pin historically accepted Gate1 verification after merge
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${ACCEPTED_BASE}" HEAD; then
            git worktree add --detach /tmp/gate1-accepted "${ACCEPTED_BASE}"
            echo 'GATE1_REFERENCE_ROOT=/tmp/gate1-accepted' >> "${GITHUB_ENV}"
          else
            echo "GATE1_REFERENCE_ROOT=${PWD}" >> "${GITHUB_ENV}"
          fi

      - name: Validate Gate1 closure
        run: |
          set -euo pipefail
          cd "${GATE1_REFERENCE_ROOT}"
          export PYTHONPATH="${PWD}/backend:${PWD}"
          python -m scripts.validate_gate1_close             --output /tmp/gate1-close.json             --require-pass
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/gate1-close.json').read_text(encoding='utf-8'))
          assert data['decision'] == 'CLOSE'
          assert data['planning_core_status'] == 'COMPLETE'
          assert data['pr9_authorized_after_merge'] is True
          assert data['baseline']['verified_current_recipe_count'] >= 30
          assert data['baseline']['active_food_ingredient_count'] >= 80
          assert all(data['criteria'].values())
          assert data['failed_criteria'] == []
          print(json.dumps(data, ensure_ascii=False, sort_keys=True))
          PY

      - name: Reconcile committed Gate1 decision receipt
        run: |
          set -euo pipefail
          cd "${GATE1_REFERENCE_ROOT}"
          python - <<'PY'
          import json
          from pathlib import Path
          generated = json.loads(Path('/tmp/gate1-close.json').read_text(encoding='utf-8'))
          committed = json.loads(
              Path('data/curation/gate1-close/decision.json').read_text(encoding='utf-8')
          )
          committed.pop('evidence_source', None)
          assert committed == generated
          print('Committed Gate1 decision matches fresh validation: PASS')
          PY

      - name: Reconcile accepted DC4 rerun receipt
        run: |
          set -euo pipefail
          cd "${GATE1_REFERENCE_ROOT}"
          export PYTHONPATH="${PWD}/backend:${PWD}"
          python -m pytest -q             backend/app/tests/test_dc4_corpus_readiness_rerun.py             --tb=short

      - name: Upload Gate1 closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate1-close-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/gate1-close.json
          if-no-files-found: error
          retention-days: 90

      - name: Ruff
        run: |
          set -euo pipefail
          cd "${GATE1_REFERENCE_ROOT}"
          python -m ruff check scripts/validate_gate1_close.py
          python -m ruff format --check scripts/validate_gate1_close.py

      - name: Migration and AI invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.db import migrations
          ids = migrations.expected_migration_ids()
          assert '0042_recipe_prepared_output_nutrition' in ids
          if '0043_shopping_engine' in ids:
              assert ids[-1] == '0043_shopping_engine'
              assert ids[-2] == '0042_recipe_prepared_output_nutrition'
          else:
              assert ids[-1] == '0042_recipe_prepared_output_nutrition'
          print('accepted 0042 prefix and current migration head: PASS')
          PY
          test "${AI_ENABLED}" = "false"
          echo 'AI_ENABLED=false: PASS'

      - name: Scope and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="${PR_BASE_SHA:-origin/main}"
          git diff --check "${base}"...HEAD
          mapfile -t changed < <(git diff --name-only "${base}"...HEAD)
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          if git merge-base --is-ancestor "${ACCEPTED_BASE}" HEAD; then
            echo 'Downstream descendant of merged Gate1: historical changed-path allowlist skipped.'
            echo 'Gate1 validation, Ruff, migration/AI and git diff --check remain active.'
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "${path}" in
              scripts/validate_gate1_close.py|\
              data/curation/gate1-close/*|\
              docs/family-food/gate1-closure.md|\
              state/current-focus.md|state/progress.md|state/handoff.md|\
              .github/workflows/gate1-close.yml|\
              .github/workflows/dc4-corpus-readiness-rerun.yml)
                ;;
              *)
                echo "Unexpected Gate1-CLOSE scope: ${path}" >&2
                exit 1
                ;;
            esac
          done
