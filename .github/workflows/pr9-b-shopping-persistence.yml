name: PR9-B Shopping persistence and transaction checks

on:
  pull_request:
    paths:
      - 'backend/app/domain/shopping_lists.py'
      - 'backend/app/services/shopping.py'
      - 'backend/app/services/shopping_contracts.py'
      - 'backend/app/persistence/sqlalchemy_core/shopping_*.py'
      - 'backend/app/migrations/versions/0043_shopping_engine.py'
      - 'backend/app/db/migrations.py'
      - 'backend/app/db/migration_lineage.py'
      - 'backend/app/tests/persistence/test_shopping_persistence.py'
      - '.github/workflows/pr9-b-shopping-persistence.yml'

permissions:
  contents: read

jobs:
  shopping-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and pinned Ruff
        run: |
          python -m pip install -e './backend[test]' 'ruff==0.16.8'
      - name: Shopping transaction and migration tests
        run: |
          python -m pytest -q backend/app/tests/persistence/test_shopping_persistence.py --tb=short
          python -m pytest -q backend/app/tests/test_shopping_calculation.py --tb=short
      - name: Lint
        run: |
          python -m ruff check --diff backend/app/domain/shopping_lists.py backend/app/services/shopping.py backend/app/services/shopping_contracts.py backend/app/persistence/sqlalchemy_core/shopping_tables.py backend/app/persistence/sqlalchemy_core/shopping_repositories.py backend/app/persistence/sqlalchemy_core/shopping_uow.py backend/app/migrations/versions/0043_shopping_engine.py backend/app/tests/persistence/test_shopping_persistence.py
          python -m ruff format --diff backend/app/domain/shopping_lists.py backend/app/services/shopping.py backend/app/services/shopping_contracts.py backend/app/persistence/sqlalchemy_core/shopping_tables.py backend/app/persistence/sqlalchemy_core/shopping_repositories.py backend/app/persistence/sqlalchemy_core/shopping_uow.py backend/app/migrations/versions/0043_shopping_engine.py backend/app/tests/persistence/test_shopping_persistence.py
          python -m ruff check backend/app/domain/shopping_lists.py backend/app/services/shopping.py backend/app/services/shopping_contracts.py backend/app/persistence/sqlalchemy_core/shopping_tables.py backend/app/persistence/sqlalchemy_core/shopping_repositories.py backend/app/persistence/sqlalchemy_core/shopping_uow.py backend/app/migrations/versions/0043_shopping_engine.py backend/app/tests/persistence/test_shopping_persistence.py
          python -m ruff format --check backend/app/domain/shopping_lists.py backend/app/services/shopping.py backend/app/services/shopping_contracts.py backend/app/persistence/sqlalchemy_core/shopping_tables.py backend/app/persistence/sqlalchemy_core/shopping_repositories.py backend/app/persistence/sqlalchemy_core/shopping_uow.py backend/app/migrations/versions/0043_shopping_engine.py backend/app/tests/persistence/test_shopping_persistence.py
      - name: PR diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$BASE_SHA"...HEAD
          test "$AI_ENABLED" = false
