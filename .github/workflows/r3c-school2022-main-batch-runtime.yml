name: R3-C School2022 MAIN batch runtime

on:
  pull_request:
    paths:
      - 'backend/app/seed/r3c_school2022_main_batch.py'
      - 'backend/app/tests/test_r3c_school2022_main_batch.py'
      - 'backend/app/services/prepared_recipe_activation.py'
      - 'backend/app/services/food_recipes.py'
      - 'backend/app/services/recipe_nutrition_v2.py'
      - 'backend/app/persistence/sqlalchemy_core/food_recipe_repositories.py'
      - 'backend/app/persistence/sqlalchemy_core/recipe_nutrition_v2.py'
      - 'data/curation/r3c-post-r3b-catalogue-gate/**'
      - 'scripts/validate_r3c_post_r3b_gate.py'
      - 'state/**'
      - '.github/workflows/r3c-school2022-main-batch-runtime.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or exact commit SHA to verify'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_ENABLED: 'false'
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend and lint tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e './backend[test]'
          python -m pip install --disable-pip-version-check 'ruff==0.16.8'

      - name: Focused R3-C verification
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/app/tests/test_r3c_school2022_main_batch.py \
            --tb=short

      - name: Gate reconciliation
        run: |
          set -euo pipefail
          python scripts/validate_r3c_post_r3b_gate.py --repo-only --json

      - name: Ruff
        run: |
          set -euo pipefail
          python -m ruff check \
            backend/app/seed/r3c_school2022_main_batch.py \
            backend/app/tests/test_r3c_school2022_main_batch.py
          python -m ruff format --check \
            backend/app/seed/r3c_school2022_main_batch.py \
            backend/app/tests/test_r3c_school2022_main_batch.py

      - name: Scope and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-origin/main}"
          git fetch origin main --no-tags
          git diff --check "$base"...HEAD

      - name: Verification summary
        run: |
          set -euo pipefail
          echo "tested revision: $(git rev-parse HEAD)"
          echo 'R3-C exactly 1 identity-only food / no Nutrition, vector or Composition: PASS'
          echo 'R3-C exactly 8 MAIN RecipeVersions + prepared authority: PASS'
          echo 'R3-C per-recipe atomic inactive publication + resumable convergence: PASS'
          echo 'R3-C batch activation one UoW / one commit / rollback: PASS'
          echo 'R3-C mixed active/inactive fail-closed + all-active replay: PASS'
          echo 'R3-C Russian consumer steps + 54-30m steam branch: PASS'
          echo 'R3-C ENERGY_KCAL + 53 UNKNOWN: PASS'
          echo 'R3-C exact beef exclusion + preserved hard MILK_2_5 breakfast proof: PASS'
          echo 'R3-A / R3-B / R2-F regressions are owned by their dedicated workflows'
          echo 'R3-C gate repository-truth reconciliation: PASS'
          echo 'migration head 0042 / no 0043: PASS'
          echo 'AI_ENABLED=false: PASS'
