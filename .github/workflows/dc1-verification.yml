name: DC1 corpus verification

on:
  pull_request:
    paths:
      - 'data/curation/data-corpus-v1-dc1/**'
      - 'data/curation/v22-13-map-a/**'
      - 'data/seed/food_ingredients/nutrition.csv'
      - 'scripts/build_data_corpus_v1_dc1.py'
      - 'scripts/validate_data_corpus_v1_dc1.py'
      - 'scripts/test_data_corpus_v1_dc1.py'
      - '.github/workflows/dc1-verification.yml'
  workflow_dispatch:
    inputs:
      source_bundle_url:
        description: 'Temporary HTTPS signed URL for the exact DC1 source ZIP'
        required: true
        type: string
      source_bundle_sha256:
        description: 'Expected SHA-256 of the source ZIP'
        required: true
        type: string

permissions:
  contents: read

env:
  DC1_PACKAGE: data/curation/data-corpus-v1-dc1
  DC1_MAPPING_DIR: data/curation/v22-13-map-a
  DC1_NUTRITION_SEED: data/seed/food_ingredients/nutrition.csv
  DC1_SOURCE_BUNDLE_SHA256: 5cc8e4d1d86a1f53b444742c06a2f9e7a509f8701438ace6591bfe7a3e5a88e6

jobs:
  package-verification:
    name: package-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python >=3.12 required, got {sys.version}")
          PY
          python3 -m venv .venv-dc1-ci
          .venv-dc1-ci/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv-dc1-ci/bin/python -m pip install --disable-pip-version-check             'openpyxl==3.1.5'             'ruff==0.16.8'

      - name: Python compile and Ruff
        shell: bash
        run: |
          set -euo pipefail
          py=.venv-dc1-ci/bin/python
          ruff=.venv-dc1-ci/bin/ruff
          scripts=(
            scripts/build_data_corpus_v1_dc1.py
            scripts/validate_data_corpus_v1_dc1.py
            scripts/test_data_corpus_v1_dc1.py
          )
          "$py" -m py_compile "${scripts[@]}"
          "$ruff" check "${scripts[@]}"
          if ! "$ruff" format --check "${scripts[@]}"; then
            "$ruff" format "${scripts[@]}"
            exit 1
          fi

      - name: Upload Ruff-formatted scripts on formatting failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dc1-ruff-formatted-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            scripts/build_data_corpus_v1_dc1.py
            scripts/validate_data_corpus_v1_dc1.py
            scripts/test_data_corpus_v1_dc1.py
          retention-days: 1

      - name: Validate committed DC1 package
        shell: bash
        run: |
          set -euo pipefail
          py=.venv-dc1-ci/bin/python
          (
            cd "$DC1_PACKAGE"
            sha256sum -c checksums.sha256
          )
          "$py" scripts/validate_data_corpus_v1_dc1.py "$DC1_PACKAGE"
          "$py" scripts/test_data_corpus_v1_dc1.py "$DC1_PACKAGE"

      - name: Scope and whitespace guard
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-origin/main}"
          git fetch origin main --no-tags
          git diff --check "$base"...HEAD
          mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          forbidden=()
          for path in "${changed[@]}"; do
            case "$path" in
              data/curation/data-corpus-v1-dc1/*|scripts/build_data_corpus_v1_dc1.py|scripts/validate_data_corpus_v1_dc1.py|scripts/test_data_corpus_v1_dc1.py|state/current-focus.md|state/handoff.md|state/progress.md|.github/workflows/dc1-verification.yml)
                ;;
              *)
                forbidden+=("$path")
                ;;
            esac
          done
          if (( ${#forbidden[@]} )); then
            printf 'Unexpected DC1 PR path(s):\n' >&2
            printf '  %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

      - name: Package verification summary
        shell: bash
        run: |
          set -euo pipefail
          echo "tested revision: $(git rev-parse HEAD)"
          echo 'py_compile: PASS'
          echo 'ruff check/format: PASS'
          echo 'checksums: PASS'
          echo 'package validator: PASS'
          echo 'adversarial suite: PASS'
          echo 'scope/whitespace: PASS'

  full-rebuild:
    name: full-rebuild-from-source-bundle
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: package-verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python >=3.12 required, got {sys.version}")
          PY
          python3 -m venv .venv-dc1-ci
          .venv-dc1-ci/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv-dc1-ci/bin/python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'

      - name: Download and authenticate source bundle
        shell: bash
        env:
          PR_SOURCE_BUNDLE_URL: ${{ secrets.DC1_SOURCE_BUNDLE_URL }}
          DISPATCH_SOURCE_BUNDLE_URL: ${{ inputs.source_bundle_url }}
          DISPATCH_SOURCE_BUNDLE_SHA256: ${{ inputs.source_bundle_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            source_bundle_url="$DISPATCH_SOURCE_BUNDLE_URL"
            source_bundle_sha256="$DISPATCH_SOURCE_BUNDLE_SHA256"
          else
            source_bundle_url="$PR_SOURCE_BUNDLE_URL"
            source_bundle_sha256="$DC1_SOURCE_BUNDLE_SHA256"
          fi

          if [[ -z "$source_bundle_url" ]]; then
            echo 'DC1_SOURCE_BUNDLE_URL repository secret is required for PR full rebuild verification.' >&2
            exit 1
          fi
          if [[ ! "$source_bundle_url" =~ ^https:// ]]; then
            echo 'source bundle URL must use HTTPS' >&2
            exit 1
          fi
          if [[ ! "$source_bundle_sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'source bundle SHA-256 must be exactly 64 hexadecimal characters' >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            "$source_bundle_url" \
            --output /tmp/dc1-source-bundle.zip
          actual="$(sha256sum /tmp/dc1-source-bundle.zip | awk '{print $1}')"
          if [[ "${actual,,}" != "${source_bundle_sha256,,}" ]]; then
            echo "source bundle SHA-256 mismatch: expected $source_bundle_sha256 got $actual" >&2
            exit 1
          fi

      - name: Safely extract exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dc1-source
          .venv-dc1-ci/bin/python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('/tmp/dc1-source-bundle.zip')
          dest = Path('/tmp/dc1-source').resolve()
          expected = {
              'russian_normative_recipes_v22_5_row_nutrients_part1.xlsx',
              'russian_normative_recipes_v22_5_row_nutrients_part2.xlsx',
              'russian_normative_recipes_v22_5_row_nutrients_part3.xlsx',
              'russian_normative_recipes_v22_5_row_nutrients_part4.xlsx',
              'russian_normative_recipes_v22_5_manifest.xlsx',
              'russian_normative_recipes_v22_13_mass_nutrients.xlsx',
              'russian_normative_recipes_v22_13_integrity_audit.xlsx',
              'russian_normative_recipes_v22_13_manifest.xlsx',
          }
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
              if names != expected:
                  missing = sorted(expected - names)
                  extra = sorted(names - expected)
                  raise SystemExit(f'source bundle file set mismatch; missing={missing} extra={extra}')
              for info in zf.infolist():
                  target = (dest / info.filename).resolve()
                  if target.parent != dest:
                      raise SystemExit(f'unsafe ZIP path: {info.filename}')
                  if info.is_dir():
                      raise SystemExit(f'unexpected directory in source bundle: {info.filename}')
                  with zf.open(info) as src, target.open('wb') as out:
                      while chunk := src.read(1024 * 1024):
                          out.write(chunk)
          PY

      - name: Rebuild twice from exact sources
        shell: bash
        run: |
          set -euo pipefail
          py=.venv-dc1-ci/bin/python
          src=/tmp/dc1-source
          build_dc1() {
            out="$1"
            "$py" scripts/build_data_corpus_v1_dc1.py               --row-shard "$src/russian_normative_recipes_v22_5_row_nutrients_part1.xlsx"               --row-shard "$src/russian_normative_recipes_v22_5_row_nutrients_part2.xlsx"               --row-shard "$src/russian_normative_recipes_v22_5_row_nutrients_part3.xlsx"               --row-shard "$src/russian_normative_recipes_v22_5_row_nutrients_part4.xlsx"               --v22-5-manifest "$src/russian_normative_recipes_v22_5_manifest.xlsx"               --v22-13-mass "$src/russian_normative_recipes_v22_13_mass_nutrients.xlsx"               --v22-13-audit "$src/russian_normative_recipes_v22_13_integrity_audit.xlsx"               --v22-13-manifest "$src/russian_normative_recipes_v22_13_manifest.xlsx"               --mapping-dir "$DC1_MAPPING_DIR"               --nutrition-seed "$DC1_NUTRITION_SEED"               --output "$out"
          }
          build_dc1 /tmp/dc1-build-a
          build_dc1 /tmp/dc1-build-b

      - name: Validate rebuilds and adversarial behavior
        shell: bash
        run: |
          set -euo pipefail
          py=.venv-dc1-ci/bin/python
          "$py" scripts/validate_data_corpus_v1_dc1.py /tmp/dc1-build-a
          "$py" scripts/validate_data_corpus_v1_dc1.py /tmp/dc1-build-b
          "$py" scripts/test_data_corpus_v1_dc1.py /tmp/dc1-build-a

      - name: Prove deterministic and committed equivalence
        shell: bash
        run: |
          set -euo pipefail
          diff -ru /tmp/dc1-build-a /tmp/dc1-build-b
          diff -ru --exclude=recovery "$DC1_PACKAGE" /tmp/dc1-build-a

      - name: Full rebuild summary
        shell: bash
        run: |
          set -euo pipefail
          echo "tested revision: $(git rev-parse HEAD)"
          echo 'source bundle SHA-256: PASS'
          echo 'source file set: PASS'
          echo 'generator source hashes: PASS'
          echo 'build A validator: PASS'
          echo 'build B validator: PASS'
          echo 'adversarial suite: PASS'
          echo 'A == B deterministic comparison: PASS'
          echo 'generated == committed package comparison: PASS'
