name: Planner candidate admission current-head

on:
  pull_request:
    paths:
      - 'backend/app/services/planner.py'
      - 'backend/app/tests/test_planner_application_boundary.py'
      - 'backend/app/tests/test_step10b_planner_mealplan_v2.py'
      - '.github/workflows/planner-admission-current-head.yml'

permissions:
  contents: read

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused backend tests and lint
        run: python -m pip install -e './backend[test]' 'ruff==0.16.10'
      - name: Current-head Planner admission and preserved Gate 1 behavior
        run: |
          python -m pytest -q \
            backend/app/tests/test_planner_application_boundary.py \
            backend/app/tests/test_planner.py \
            backend/app/tests/test_planner_gate1_fixtures.py \
            backend/app/tests/test_step10b_planner_mealplan_v2.py --tb=short
      - name: Focused Ruff check and format
        run: |
          # The pre-existing files have unrelated B008/C409/FURB157 debt;
          # this added workflow checks syntax, undefined names, imports and format.
          python -m ruff format --diff backend/app/services/planner.py backend/app/tests/test_planner_application_boundary.py backend/app/tests/test_step10b_planner_mealplan_v2.py
          python -m ruff check --select E4,E7,E9,F,I backend/app/services/planner.py backend/app/tests/test_planner_application_boundary.py backend/app/tests/test_step10b_planner_mealplan_v2.py
          python -m ruff format --check backend/app/services/planner.py backend/app/tests/test_planner_application_boundary.py backend/app/tests/test_step10b_planner_mealplan_v2.py
      - name: PR whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD
