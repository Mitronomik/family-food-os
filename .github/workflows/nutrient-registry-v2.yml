# Step 2 registry V2 verification
name: Nutrient registry V2

on:
  push:
    paths:
      - 'backend/app/domain/nutrient_vector.py'
      - 'backend/app/domain/nutrient_method_adapters.py'
      - 'backend/app/db/migrations.py'
      - 'backend/app/db/migration_lineage.py'
      - 'backend/app/migrations/versions/0035_versioned_nutrient_registry.py'
      - 'backend/app/persistence/sqlalchemy_core/nutrient_vector_tables.py'
      - 'backend/app/persistence/sqlalchemy_core/nutrient_vector_repository.py'
      - 'backend/app/persistence/sqlalchemy_core/nutrition_read_scope.py'
      - 'backend/app/persistence/sqlalchemy_core/food_composition_repository.py'
      - 'backend/app/persistence/sqlalchemy_core/food_composition_scope.py'
      - 'backend/app/services/nutrient_vector_contracts.py'
      - 'backend/app/services/food_composition_contracts.py'
      - 'backend/app/services/nutrition_methodology.py'
      - 'data/curation/nutrient-registry-v2/**'
      - 'data/curation/russian-methodology/reference-compatibility.json'
      - '.github/workflows/nutrient-registry-v2.yml'
  pull_request:
    paths:
      - 'backend/app/domain/nutrient_vector.py'
      - 'backend/app/domain/nutrient_method_adapters.py'
      - 'backend/app/domain/nutrition_methodology.py'
      - 'backend/app/db/migrations.py'
      - 'backend/app/db/migration_lineage.py'
      - 'backend/app/migrations/versions/0035_versioned_nutrient_registry.py'
      - 'backend/app/persistence/sqlalchemy_core/nutrient_vector_tables.py'
      - 'backend/app/persistence/sqlalchemy_core/nutrient_vector_repository.py'
      - 'backend/app/persistence/sqlalchemy_core/nutrition_read_scope.py'
      - 'backend/app/persistence/sqlalchemy_core/food_composition_repository.py'
      - 'backend/app/persistence/sqlalchemy_core/food_composition_scope.py'
      - 'backend/app/services/nutrient_vector_contracts.py'
      - 'backend/app/services/food_composition_contracts.py'
      - 'backend/app/services/nutrition_methodology.py'
      - 'backend/app/tests/test_nutrient_registry_v2.py'
      - 'backend/app/tests/test_nutrient_vector.py'
      - 'backend/app/tests/test_nutrition_methodology_service.py'
      - 'backend/app/tests/test_food_composition.py'
      - 'backend/app/tests/test_migration_lineage.py'
      - 'backend/app/tests/test_migration_runner_rebuild.py'
      - 'backend/app/tests/test_partial_nutrition_profile_migration.py'
      - 'data/curation/nutrient-registry-v2/**'
      - 'data/curation/russian-methodology/reference-compatibility.json'
      - 'docs/family-food/**'
      - 'state/**'
      - '.github/workflows/nutrient-registry-v2.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Focused registry V2 and adapter verification
        run: >-
          python -m pytest -q
          backend/app/tests/test_nutrient_registry_v2.py
          backend/app/tests/test_nutrient_vector.py
          backend/app/tests/test_nutrition_methodology.py
          backend/app/tests/test_nutrition_methodology_service.py
          backend/app/tests/test_reference_comparison.py
          backend/app/tests/test_food_composition.py
          backend/app/tests/test_partial_nutrition_profile_migration.py
          backend/app/tests/test_migration_lineage.py
          backend/app/tests/test_migration_runner_rebuild.py
          backend/app/tests/persistence/test_migration_coexistence.py

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      AI_ENABLED: 'false'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Full backend regression shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find backend/app/tests -type f -name 'test_*.py' | sort)
          selected=()
          for index in "${!files[@]}"; do
            if (( index % 4 == SHARD )); then
              selected+=("${files[$index]}")
            fi
          done
          printf 'backend shard %s: %s files\n' "$SHARD" "${#selected[@]}"
          test "${#selected[@]}" -gt 0
          python -m pytest -q "${selected[@]}"

  launcher-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - name: Full launcher regression
        run: python -m pytest -q launcher/tests
