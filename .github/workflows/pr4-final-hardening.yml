name: PR4 final fail-closed hardening

on:
  push:
    branches:
      - migration/pr4-recipe-catalogue

permissions:
  contents: write

jobs:
  harden-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Harden trusted seed against per-recipe drift
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/seed/food_recipes.py')
          text = path.read_text(encoding='utf-8')

          old = '''CURATION_DIRECTORY = PROJECT_ROOT / "data" / "curation" / "pr4-data2"\nEXPECTED_RECIPE_COUNT = 30\n'''
          new = '''CURATION_DIRECTORY = PROJECT_ROOT / "data" / "curation" / "pr4-data2"\nCOVERAGE_PATH = CURATION_DIRECTORY / "draft-ingredient-coverage.json"\nSTEP_CURATION_PATH = PROJECT_ROOT / "data" / "curation" / "pr4-runtime" / "recipe-steps.json"\nEXPECTED_RECIPE_COUNT = 30\n'''
          if text.count(old) != 1:
              raise SystemExit('constant insertion point mismatch')
          text = text.replace(old, new)

          old = '''    corpus_payload = _json(CURATION_DIRECTORY / "recipe-corpus.json")\n    recipe_rows = recipes_payload.get("recipes")\n    source_rows = manifest_payload.get("sources")\n    corpus_rows = corpus_payload.get("recipes")\n'''
          new = '''    corpus_payload = _json(CURATION_DIRECTORY / "recipe-corpus.json")\n    coverage_payload = _json(COVERAGE_PATH)\n    step_payload = _json(STEP_CURATION_PATH)\n    recipe_rows = recipes_payload.get("recipes")\n    source_rows = manifest_payload.get("sources")\n    corpus_rows = corpus_payload.get("recipes")\n    coverage_rows = coverage_payload.get("recipes")\n    step_rows = step_payload.get("recipes")\n'''
          if text.count(old) != 1:
              raise SystemExit('payload insertion point mismatch')
          text = text.replace(old, new)

          old = '''    if not isinstance(corpus_rows, list) or len(corpus_rows) != EXPECTED_RECIPE_COUNT:\n        raise FoodRecipeSeedError(\n            "Accepted PR4-DATA2 corpus must contain exactly 30 recipes."\n        )\n\n    corpus_by_id = _unique_by(corpus_rows, "recipe_source_id", "accepted DATA2 corpus")\n    manifest_by_id = _unique_by(source_rows, "recipe_source_id", "source manifest")\n    accepted_ids = set(corpus_by_id)\n    if set(manifest_by_id) != accepted_ids:\n        raise FoodRecipeSeedError(\n            "Source manifest identities differ from accepted PR4-DATA2."\n        )\n'''
          new = '''    if not isinstance(corpus_rows, list) or len(corpus_rows) != EXPECTED_RECIPE_COUNT:\n        raise FoodRecipeSeedError(\n            "Accepted PR4-DATA2 corpus must contain exactly 30 recipes."\n        )\n    if not isinstance(coverage_rows, list) or len(coverage_rows) != EXPECTED_RECIPE_COUNT:\n        raise FoodRecipeSeedError(\n            "Accepted PR4-DATA2 coverage must contain exactly 30 recipes."\n        )\n    if not isinstance(step_rows, list) or len(step_rows) != EXPECTED_RECIPE_COUNT:\n        raise FoodRecipeSeedError(\n            "Reviewed PR4 runtime steps must contain exactly 30 recipes."\n        )\n\n    corpus_by_id = _unique_by(corpus_rows, "recipe_source_id", "accepted DATA2 corpus")\n    manifest_by_id = _unique_by(source_rows, "recipe_source_id", "source manifest")\n    coverage_by_id = _unique_by(coverage_rows, "source_recipe_id", "accepted DATA2 coverage")\n    steps_by_id = _unique_by(step_rows, "recipe_source_id", "reviewed PR4 runtime steps")\n    accepted_ids = set(corpus_by_id)\n    if not (\n        set(manifest_by_id)\n        == set(coverage_by_id)\n        == set(steps_by_id)\n        == accepted_ids\n    ):\n        raise FoodRecipeSeedError(\n            "Seed manifest/coverage/step identities differ from accepted PR4-DATA2."\n        )\n'''
          if text.count(old) != 1:
              raise SystemExit('identity validation block mismatch')
          text = text.replace(old, new)

          old = '''        _validate_provenance(version, manifest, corpus, index)\n\n        ingredient_rows = version.get("ingredients")\n'''
          new = '''        _validate_provenance(version, manifest, corpus, index)\n        _validate_curation_structure(\n            version,\n            manifest,\n            corpus,\n            coverage_by_id[source_id],\n            steps_by_id[source_id],\n            index,\n        )\n\n        ingredient_rows = version.get("ingredients")\n'''
          if text.count(old) != 1:
              raise SystemExit('curation validation call point mismatch')
          text = text.replace(old, new)

          marker = '''def _ingredient(\n    row: object, recipe_index: int, ingredient_index: int\n) -> TrustedRecipeIngredientSeed:\n'''
          helper = '''def _validate_curation_structure(\n    version: dict[str, object],\n    manifest: dict[str, object],\n    corpus: dict[str, object],\n    coverage: dict[str, object],\n    step_record: dict[str, object],\n    index: int,\n) -> None:\n    ingredient_rows = version.get("ingredients")\n    coverage_rows = coverage.get("rows")\n    if not isinstance(ingredient_rows, list) or not isinstance(coverage_rows, list):\n        raise FoodRecipeSeedError(\n            f"recipes.json record {index} lacks reviewable ingredient curation."\n        )\n\n    selected_rows = [\n        row\n        for row in coverage_rows\n        if isinstance(row, dict)\n        and isinstance(row.get("selection"), str)\n        and row["selection"].startswith("SELECTED")\n    ]\n    if len(ingredient_rows) != len(selected_rows):\n        raise FoodRecipeSeedError(\n            f"recipes.json record {index} ingredient rows differ from accepted DATA2."\n        )\n    for ingredient_index, (actual, accepted) in enumerate(\n        zip(ingredient_rows, selected_rows, strict=True), start=1\n    ):\n        if not isinstance(actual, dict):\n            raise FoodRecipeSeedError(\n                f"recipes.json record {index} ingredient {ingredient_index} is invalid."\n            )\n        selected_codes = accepted.get("selected_codes")\n        if not isinstance(selected_codes, list) or len(selected_codes) != 1:\n            raise FoodRecipeSeedError(\n                f"Accepted DATA2 ingredient {ingredient_index} is not singly resolved."\n            )\n        selection = str(accepted["selection"])\n        expected_optional = selection != "SELECTED_REQUIRED"\n        if (\n            actual.get("food_ingredient_code") != selected_codes[0]\n            or actual.get("source_amount_text") != accepted.get("source_text")\n            or actual.get("optional") is not expected_optional\n        ):\n            raise FoodRecipeSeedError(\n                f"recipes.json record {index} ingredient {ingredient_index} differs from accepted DATA2."\n            )\n        if selection == "SELECTED_CONDITIONAL" and not _optional_text(\n            actual.get("prep_note")\n        ):\n            raise FoodRecipeSeedError(\n                f"recipes.json record {index} conditional ingredient loses its source condition."\n            )\n\n    equipment_raw = version.get("equipment_codes")\n    accepted_equipment = corpus.get("equipment")\n    if not isinstance(equipment_raw, list) or not isinstance(accepted_equipment, list):\n        raise FoodRecipeSeedError(\n            f"recipes.json record {index} lacks reviewable equipment curation."\n        )\n    expected_equipment = []\n    for item in accepted_equipment:\n        if not isinstance(item, dict) or not isinstance(item.get("equipment_code"), str):\n            raise FoodRecipeSeedError(\n                f"Accepted DATA2 equipment for record {index} is invalid."\n            )\n        expected_equipment.append(item["equipment_code"].lower())\n    if equipment_raw != expected_equipment:\n        raise FoodRecipeSeedError(\n            f"recipes.json record {index} equipment differs from accepted DATA2."\n        )\n\n    steps_raw = version.get("steps")\n    reviewed_steps = step_record.get("steps")\n    if steps_raw != reviewed_steps:\n        raise FoodRecipeSeedError(\n            f"recipes.json record {index} steps differ from reviewed PR4 runtime curation."\n        )\n    if step_record.get("accepted_data2_sha256") != corpus.get("source_sha256"):\n        raise FoodRecipeSeedError(\n            f"Reviewed step record {index} is not tied to accepted DATA2 hash."\n        )\n    if (\n        manifest.get("step_extraction_source_sha256")\n        != step_record.get("extraction_source_sha256")\n        or manifest.get("step_comparison_result")\n        != step_record.get("comparison_result")\n    ):\n        raise FoodRecipeSeedError(\n            f"source-manifest.json record {index} step lineage differs from reviewed curation."\n        )\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('helper insertion point mismatch')
          text = text.replace(marker, helper + marker)
          path.write_text(text, encoding='utf-8')

          test_path = Path('backend/app/tests/test_food_recipe_seed.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''def test_seed_is_atomic_idempotent_and_has_exact_production_counts(tmp_path):\n'''
          addition = '''def test_loader_rejects_same_count_ingredient_mapping_drift(tmp_path):\n    changed = _copy_seed(tmp_path)\n    path = changed / "recipes.json"\n    payload = json.loads(path.read_text(encoding="utf-8"))\n    ingredients = payload["recipes"][0]["version"]["ingredients"]\n    ingredients[0]["food_ingredient_code"], ingredients[1]["food_ingredient_code"] = (\n        ingredients[1]["food_ingredient_code"],\n        ingredients[0]["food_ingredient_code"],\n    )\n    path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n    with pytest.raises(FoodRecipeSeedError, match="ingredient 1 differs"):\n        load_seed_entries(changed)\n\n\ndef test_loader_rejects_same_count_equipment_drift(tmp_path):\n    changed = _copy_seed(tmp_path)\n    path = changed / "recipes.json"\n    payload = json.loads(path.read_text(encoding="utf-8"))\n    equipment = payload["recipes"][0]["version"]["equipment_codes"]\n    assert len(equipment) >= 2\n    equipment[0], equipment[1] = equipment[1], equipment[0]\n    path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")\n    with pytest.raises(FoodRecipeSeedError, match="equipment differs"):\n        load_seed_entries(changed)\n\n\ndef test_loader_rejects_same_count_step_or_step_lineage_drift(tmp_path):\n    changed = _copy_seed(tmp_path)\n    recipes_path = changed / "recipes.json"\n    recipes = json.loads(recipes_path.read_text(encoding="utf-8"))\n    recipes["recipes"][0]["version"]["steps"][0] += " altered"\n    recipes_path.write_text(\n        json.dumps(recipes, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"\n    )\n    with pytest.raises(FoodRecipeSeedError, match="steps differ"):\n        load_seed_entries(changed)\n\n    changed = _copy_seed(tmp_path / "lineage")\n    manifest_path = changed / "source-manifest.json"\n    manifest = json.loads(manifest_path.read_text(encoding="utf-8"))\n    manifest["sources"][0]["step_comparison_result"] = "STALE"\n    manifest_path.write_text(\n        json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8"\n    )\n    with pytest.raises(FoodRecipeSeedError, match="step lineage differs"):\n        load_seed_entries(changed)\n\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit('test insertion point mismatch')
          test_path.write_text(tests.replace(marker, addition + marker), encoding='utf-8')
          PY

      - name: Install backend and lint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[test]' ruff
          ruff format backend/app/seed/food_recipes.py backend/app/tests/test_food_recipe_seed.py
          ruff check --fix backend/app/seed/food_recipes.py backend/app/tests/test_food_recipe_seed.py
          ruff format backend/app/seed/food_recipes.py backend/app/tests/test_food_recipe_seed.py
          ruff format --check backend/app/seed/food_recipes.py backend/app/tests/test_food_recipe_seed.py
          ruff check backend/app/seed/food_recipes.py backend/app/tests/test_food_recipe_seed.py

      - name: Verify DATA2 and PR4 focused
        run: |
          python scripts/validate_pr4_data2.py
          python -m pytest -q backend/app/tests/test_pr4_data2_research.py
          python -m pytest -q \
            backend/app/tests/test_food_recipe_domain.py \
            backend/app/tests/test_food_recipe_application.py \
            backend/app/tests/test_food_recipe_architecture.py \
            backend/app/tests/test_food_recipe_migration.py \
            backend/app/tests/test_food_recipe_seed.py \
            backend/app/tests/persistence/test_food_recipe_repository.py

      - name: Verify full backend and launcher regression
        run: python -m pytest -q backend/app/tests launcher/tests

      - name: Final scope and commit
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/workflows/pr4-final-hardening.yml
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached origin/main -- .github/workflows)"
          git config user.name 'FamilyFoodOS Orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'PR4: fail closed on curation structure drift'
          git push origin HEAD:migration/pr4-recipe-catalogue
