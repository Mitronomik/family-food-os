name: Planner v0.5 ordering

on:
  pull_request:
    paths:
      - 'backend/app/domain/planner.py'
      - 'backend/app/services/planner.py'
      - 'backend/app/tests/test_planner_ordering_v05.py'
      - 'backend/app/tests/test_planner_energy_allocation_v04.py'
      - '.github/workflows/planner-v05-ordering.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or exact commit SHA to verify'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  planner-v05:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_ENABLED: 'false'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend and Ruff
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e './backend[test]'
          python -m pip install --disable-pip-version-check 'ruff==0.16.8'

      - name: Focused Planner v0.5 tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/app/tests/test_planner_ordering_v05.py \
            backend/app/tests/test_planner.py \
            backend/app/tests/test_planner_application_boundary.py \
            backend/app/tests/test_planner_energy_allocation_v04.py \
            --tb=short

      - name: Historical DC4 evidence compatibility
        run: |
          set -euo pipefail
          python -m pytest -q backend/app/tests/test_dc4_corpus_readiness.py --tb=short

      - name: Ruff
        run: |
          set -euo pipefail
          python -m ruff check backend/app/tests/test_planner_ordering_v05.py
          python -m ruff format --check backend/app/tests/test_planner_ordering_v05.py

      - name: Migration and AI invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.db import migrations
          ids = migrations.expected_migration_ids()
          assert ids[-1:] == ['0042_recipe_prepared_output_nutrition'] or ids[-2:] == [
              '0042_recipe_prepared_output_nutrition', '0043_shopping_engine'
          ]
          print('accepted 0042 prefix and current migration head: PASS')
          PY
          test "${AI_ENABLED}" = "false"
          echo 'AI_ENABLED=false: PASS'

      - name: Scope and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="${PR_BASE_SHA:-origin/main}"
          git diff --check "${base}"...HEAD
          mapfile -t changed < <(git diff --name-only "${base}"...HEAD)
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              backend/app/domain/planner.py|\
              backend/app/services/planner.py|\
              backend/app/tests/test_planner_ordering_v05.py|\
              backend/app/tests/test_planner_energy_allocation_v04.py|\
              .github/workflows/planner-v05-ordering.yml)
                ;;
              *)
                echo "Unexpected B2 scope: ${path}" >&2
                exit 1
                ;;
            esac
          done
