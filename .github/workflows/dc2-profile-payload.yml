name: DC2 profile payload historical compatibility

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact historical ref to verify (normally accepted PR74 merge)
        required: true
        default: '4c9598b623b9042924bb1f8d864c56d3d0a407c4'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_dc2_profile_payload.py --validate-repository
      - run: python scripts/test_dc2_profile_payload.py
