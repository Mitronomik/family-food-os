name: PR10-CORE two-step persisted fixture evidence

on:
  pull_request:
    paths:
      - 'scripts/audit_pr10_core_two_step_fixture.py'
      - 'backend/app/tests/test_pr10_core_two_step_fixture.py'
      - '.github/workflows/pr10-core-two-step-fixture-evidence.yml'
      - 'docs/family-food/pr10-core-two-step-current-fixture-*.md'
      - 'state/current-focus.md'
      - 'state/progress.md'
      - 'state/handoff.md'

permissions:
  contents: read

jobs:
  two-step-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test and lint baseline
        run: python -m pip install -e './backend[test]' 'ruff==0.16.10'
      - name: Existing Planner fixture integrity plus targeted evidence tests
        run: |
          python -m pytest -q backend/app/tests/test_pr10_meta_gate2_fixture.py backend/app/tests/test_pr10_core_two_step_fixture.py --tb=short
      - name: Rebuild persisted synthetic fixture and capture two exact steps
        run: |
          python -m scripts.audit_pr10_core_two_step_fixture --output-dir /tmp/pr10-core-two-step-receipts
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/pr10-core-two-step-receipts")
          fixture = json.loads((root / "pr10-meta-fresh-fixture.json").read_text(encoding="utf-8"))
          receipt = json.loads((root / "pr10-core-two-step-evidence.json").read_text(encoding="utf-8"))
          assert fixture["counts"]["members"] == 3
          assert fixture["counts"]["meal_events"] == 21
          assert fixture["counts"]["servings"] == 42
          assert receipt["distinct_current_meal_events"] == 2
          assert receipt["fixture_planner_semantic_sha256"] == "2d6cb581649863b7edbd3c0efff2bae2934c6a512c99a45d10e92f92f514cb3d"
          assert receipt["independently_approved_step_count"] == 0
          assert receipt["gate"] == "NO_GO_TO_PR10_CORE_RUNTIME"
          assert all(not row["production_executable_task_allowed"] for row in receipt["candidates"])
          PY
          sha256sum /tmp/pr10-core-two-step-receipts/*.json
      - name: Focused Ruff and format
        run: |
          python -m ruff check scripts/audit_pr10_core_two_step_fixture.py backend/app/tests/test_pr10_core_two_step_fixture.py
          python -m ruff format --check scripts/audit_pr10_core_two_step_fixture.py backend/app/tests/test_pr10_core_two_step_fixture.py
      - name: PR whitespace scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD
      - name: Upload read-back evidence for independent review
        uses: actions/upload-artifact@v4
        with:
          name: pr10-core-two-step-fresh-fixture-evidence
          path: /tmp/pr10-core-two-step-receipts/*.json
          if-no-files-found: error
          retention-days: 30
