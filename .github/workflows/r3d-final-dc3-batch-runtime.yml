name: R3-D final DC3 batch runtime

on:
  pull_request:
    paths:
      - 'backend/app/seed/r3d_final_dc3_batch.py'
      - 'backend/app/tests/test_r3d_final_dc3_batch.py'
      - 'backend/app/services/prepared_recipe_activation.py'
      - 'backend/app/services/food_recipes.py'
      - 'backend/app/services/recipe_nutrition_v2.py'
      - 'backend/app/persistence/sqlalchemy_core/food_recipe_repositories.py'
      - 'backend/app/persistence/sqlalchemy_core/recipe_nutrition_v2.py'
      - 'data/curation/r3d-final-dc3-batch-gate/**'
      - 'scripts/validate_r3d_final_dc3_gate.py'
      - 'state/**'
      - '.github/workflows/r3d-final-dc3-batch-runtime.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag or exact commit SHA to verify'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_ENABLED: 'false'
      ACCEPTED_BASE: 'a6c1a0bd203e0ec21fd73eb4107282c2b144ff9a'
    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend and lint tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e './backend[test]'
          python -m pip install --disable-pip-version-check 'ruff==0.16.8'

      - name: Focused R3-D runtime verification
        run: |
          set -euo pipefail
          python -m pytest -q             backend/app/tests/test_r3d_final_dc3_batch.py             --tb=short

      - name: Gate reconciliation
        run: |
          set -euo pipefail
          python scripts/validate_r3d_final_dc3_gate.py --json

      - name: Ruff
        run: |
          set -euo pipefail
          python -m ruff check             backend/app/seed/r3d_final_dc3_batch.py             backend/app/tests/test_r3d_final_dc3_batch.py
          python -m ruff format --check             backend/app/seed/r3d_final_dc3_batch.py             backend/app/tests/test_r3d_final_dc3_batch.py

      - name: Migration and AI invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.db import migrations

          ids = migrations.expected_migration_ids()
          assert ids[-1] == '0042_recipe_prepared_output_nutrition'
          assert not any(item.startswith('0043') for item in ids)
          print('migration head 0042 / no 0043: PASS')
          PY
          test "${AI_ENABLED}" = "false"
          echo 'AI_ENABLED=false: PASS'

      - name: Scope and whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="${PR_BASE_SHA:-${ACCEPTED_BASE}}"
          git diff --check "${base}"...HEAD
          mapfile -t changed < <(git diff --name-only "${base}"...HEAD)
          (( ${#changed[@]} > 0 ))
          printf 'Changed paths:\n'
          printf '  %s\n' "${changed[@]}"

          if [[ "${base}" != "${ACCEPTED_BASE}" ]]; then
            echo 'Downstream PR after merged R3-D runtime: historical changed-path restriction skipped.'
            echo 'Focused runtime, gate reconciliation, migration/AI invariants and diff whitespace remain enforced.'
            exit 0
          fi

          for path in "${changed[@]}"; do
            case "${path}" in
              backend/app/seed/r3d_final_dc3_batch.py|              backend/app/tests/test_r3d_final_dc3_batch.py|              state/current-focus.md|state/progress.md|state/handoff.md|              .github/workflows/r3d-final-dc3-batch-runtime.yml|              .github/workflows/r3d-final-dc3-gate.yml)
                ;;
              *)
                echo "Unexpected R3-D runtime scope: ${path}" >&2
                exit 1
                ;;
            esac
          done

      - name: Verification summary
        run: |
          set -euo pipefail
          echo "tested revision: $(git rev-parse HEAD)"
          echo 'R3-D exactly 10 identity-only FoodIngredients / no Nutrition, vector or Composition: PASS'
          echo 'R3-D exactly 10 MAIN RecipeVersions + prepared authority: PASS'
          echo 'R3-D exact card URL/hash/source rows + full review contract commitment (ingredients/process binding/partition/household/authority): PASS'
          echo 'R3-D household applicability + medical-context quarantine: PASS'
          echo 'R3-D PREPARED_OUTPUT_V1 / ENERGY_KCAL + 53 UNKNOWN: PASS'
          echo 'R3-D per-recipe atomic inactive publication + resumable convergence: PASS'
          echo 'R3-D batch activation one UoW / one commit / rollback: PASS'
          echo 'R3-D mixed active/inactive fail-closed + all-active replay: PASS'
          echo 'R3-D Planner projection 51 exact-energy / 33 MAIN: PASS'
          echo 'R3-D exact beef exclusion 19 unaffected / capacity 57: PASS'
          echo 'R3-D hard MILK_2_5 breakfast proof remains capacity 9: PASS'
          echo 'R3-D gate repository/source reconciliation: PASS'
          echo 'migration head 0042 / no 0043: PASS'
          echo 'AI_ENABLED=false: PASS'
